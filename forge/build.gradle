plugins { id 'java'; id 'net.minecraftforge.gradle' }
base { archivesName = "foodcraft-${rootProject.minecraft_version}-forge" }
def qaUser=providers.gradleProperty('foodcraftUsername').getOrElse('FoodCraftQA1')
def qaRunDir=providers.gradleProperty('foodcraftRunDir').getOrElse(new File(rootProject.foodcraftWorkDir,'run-forge').absolutePath)
minecraft {
    mappings channel: 'official', version: rootProject.minecraft_version
    runs {
        configureEach {
            workingDirectory rootProject.file(qaRunDir)
            args '-mixin.config=foodcraft.mixins.json'
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'foodcraft'
            if (rootProject.hasProperty('foodcraftSoak')) property 'foodcraft.soak', 'true'
            mods { foodcraft { source sourceSets.main } }
        }
        client {
            args '--username', qaUser
            if (rootProject.hasProperty('foodcraftQuickSingle')) args '--quickPlaySingleplayer', 'FoodCraftQA'
            if (rootProject.hasProperty('foodcraftQuickServer')) args '--quickPlayMultiplayer', rootProject.property('foodcraftQuickServer')
        }
        server { args '--nogui' }
        gameTestServer {}
    }
}
sourceSets.main.java.srcDirs += ['../common/src/main/java', '../core/src/main/java']
sourceSets.main.resources.srcDirs += ['../common/src/main/resources']
dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    compileOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-forge-api:${rootProject.jei_version}")
    if (providers.gradleProperty('foodcraftJei').isPresent()) runtimeOnly fg.deobf("mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}")
    if (providers.gradleProperty('foodcraftCraftTweaker').isPresent()) runtimeOnly fg.deobf("com.blamejared.crafttweaker:CraftTweaker-forge-${rootProject.minecraft_version}:${rootProject.crafttweaker_version}")
}
jar { from(rootProject.file('LICENSE')); manifest { attributes 'Implementation-Version': project.version, 'MixinConfigs': 'foodcraft.mixins.json' }; finalizedBy 'reobfJar' }
